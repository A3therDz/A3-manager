name: 功能建议
description: 想要的新功能或改进
title: "[Feature] "
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: 想解决的问题
      description: 你现在的操作流程里,哪一步最别扭?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: 期望的做法
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: 备选方案(可选)
    validations:
      required: false
